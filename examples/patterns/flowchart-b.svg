# FigDown — figures as text. Spec: https://github.com/FigDown/figdown

figdown 0.2 flowchart
title "Flow with Retry Loop"

# 0.1 (`FLOWCHART-ROLE-KEYWORDS`): roles, not shapes. The retry is a plain back-edge
# (d2 -[no]-> p1) — the language has no loop construct and needs none.
terminator s   "Start"
process    p1  "Step 1"
decision   d1  "Check A?"
process    p2  "Step 2"
decision   d2  "Check B?"
process    p3  "Step 3"
terminator e   "Done"

flow down

flowline s  -> p1
flowline p1 -> d1
flowline d1 -[yes]-> p2
flowline d1 -[no]-> e
flowline p2 -> d2
flowline d2 -[yes]-> p3
flowline d2 -[no]-> p1
flowline p3 -> e


]]></metadata></svg>