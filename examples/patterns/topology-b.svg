0" text-anchor="middle" fill="#555" data-port-sq="530.40,91.74">p2</text><text x="629.6909090909091" y="89.5" font-size="10" text-anchor="middle" fill="#fff" data-port-sq="637.60,78.00" stroke="#fff" stroke-width="3" stroke-linejoin="round">p3</text><text x="629.6909090909091" y="89.5" font-size="10" text-anchor="middle" fill="#555" data-port-sq="637.60,78.00">p3</text><text x="701.5090909090909" y="89.5" font-size="10" text-anchor="middle" fill="#fff" data-port-sq="693.60,78.00" stroke="#fff" stroke-width="3" stroke-linejoin="round">p1</text><text x="701.5090909090909" y="89.5" font-size="10" text-anchor="middle" fill="#555" data-port-sq="693.60,78.00">p1</text></g><metadata id="figdown-source" data-sha256="e98ada10e08dece5e4fc20641cc99060f7d5d496669ecefd96c849a76271a157" data-engine-version="0.5.1"><![CDATA[
# FigDown — figures as text. Spec: https://github.com/FigDown/figdown

figdown 0.1 topology
title "Chain with redundant pair and link bundle"

# Structural pattern abstracted from real topology figures:
#   - Linear ingress → core → egress chain
#   - A redundant device pair in the core (Device B1 + Device B2),
#     each carrying one leg of the traffic
#   - A link bundle grouping the two parallel legs between the
#     upstream and downstream core nodes
#   - Numbered port labels on each link

node in1 "Ingress Node" shape=rounded fill=#f0fdf4
node c1  "Core Node 1" shape=rounded fill=#eff6ff

group pair "Redundant Pair"
node b1  "Device B1" shape=rounded fill=#fef9c3 in=pair
node b2  "Device B2" shape=rounded fill=#fef9c3 in=pair

node c2  "Core Node 2" shape=rounded fill=#eff6ff
node out1 "Egress Node" shape=rounded fill=#f0fdf4

flow right
rank b1,b2

# ingress to first core node
edge in1 [p1] -- [p1] c1

# c1 fans into the redundant pair
edge c1 [p2] -- [p1] b1
edge c1 [p3] -- [p1] b2

# redundant pair fans into second core node
edge b1 [p2] -- [p1] c2
edge b2 [p2] -- [p2] c2

# egress
edge c2 [p3] -- [p1] out1

# link bundle: the two parallel legs through the redundant pair
bundle bund1 "Link Bundle 1" c1--b1,c1--b2

]]></metadata></svg>