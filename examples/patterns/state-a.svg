 font-size="11" text-anchor="end" fill="#fff" stroke="#fff" stroke-width="3" stroke-linejoin="round">cond1</text><text x="138.1627987455107" y="174.25053932911007" font-size="11" text-anchor="end" fill="#3f5b8c">cond1</text><path d="M95.76515168668719 237.9505393291101 L97.12807641166727 226.50026264275712 L106.20712042603294 233.0585367896048 z" fill="#3f5b8c" stroke="none"/><text x="215.6" y="248.75" font-size="11" text-anchor="middle" fill="#fff" stroke="#fff" stroke-width="3" stroke-linejoin="round">cond2</text><text x="215.6" y="248.75" font-size="11" text-anchor="middle" fill="#7a5638">cond2</text><path d="M310 254.5 L299.92 260.1 L299.92 248.9 z" fill="#7a5638" stroke="none"/><text x="279.4" y="176.29999999999998" font-size="11" text-anchor="start" fill="#fff" stroke="#fff" stroke-width="3" stroke-linejoin="round">reset</text><text x="279.4" y="176.29999999999998" font-size="11" text-anchor="start" fill="#555">reset</text><path d="M222.16470588235293 106 L232.73620683133885 110.60540635401367 L223.83939910199427 117.4088475588066 z" fill="#555" stroke="none"/><text x="215.6" y="273.85" font-size="11" text-anchor="middle" fill="#fff" stroke="#fff" stroke-width="3" stroke-linejoin="round">retry</text><text x="215.6" y="273.85" font-size="11" text-anchor="middle" fill="#55611f">retry</text><path d="M121.19999999999999 261.5 L131.28 255.9 L131.28 267.1 z" fill="#55611f" stroke="none"/><text x="155.8372012544893" y="178.3494606708899" font-size="11" text-anchor="start" fill="#fff" stroke="#fff" stroke-width="3" stroke-linejoin="round">abort</text><text x="155.8372012544893" y="178.3494606708899" font-size="11" text-anchor="start" fill="#206a72">abort</text><path d="M198.23484831331282 108.0494606708899 L196.87192358833278 119.49973735724285 L187.79287957396707 112.94146321039517 z" fill="#206a72" stroke="none"/></g><metadata id="figdown-source" data-sha256="5148b225ec87fd9c773fae3bb5cffcb516d149636fd06051226dae2afb61221d" data-engine-version="0.5.0"><![CDATA[
# FigDown — figures as text. Spec: https://github.com/FigDown/figdown

figdown 0.2 statechart
title "3-State Cycle with Conditional Transitions"

state idle   "IDLE"    fill=#dbeafe
state active "ACTIVE"
state wait   "WAIT"

flow down

transition idle -[cond1]-> active
transition active -[cond2]-> wait
transition wait -[reset]-> idle
transition wait -[retry]-> active
transition active -[abort]-> idle

layout
# Triangular arrangement so cycle edges are spatially distinct from back-edges.
# idle at top-centre; active at bottom-left; wait at bottom-right.
pin idle   at=(180,50)
pin active at=(50,220)
pin wait   at=(310,220)

]]></metadata></svg>