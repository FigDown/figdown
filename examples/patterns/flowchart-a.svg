# FigDown — figures as text. Spec: https://github.com/FigDown/figdown

figdown 0.2 flowchart
title "Linear Flow with Two Sequential Decisions"

# 0.1 (`FLOWCHART-ROLE-KEYWORDS`): the role vocabulary. `terminator`/`process`/`decision`
# say what each step IS; the geometry (rounded/box/diamond) is derived from
# the role, so no line writes shape= at all.
terminator s   "Start"
process    p1  "Step 1"
decision   d1  "Check A?"
process    p2  "Step 2"
decision   d2  "Check B?"
process    r1  "Result X"
process    r2  "Result Y"
process    r3  "Result Z"
terminator e   "Done"

flow down

flowline s  -> p1
flowline p1 -> d1
flowline d1 -[yes]-> p2
flowline d1 -[no]-> r1
flowline p2 -> d2
flowline d2 -[yes]-> r2
flowline d2 -[no]-> r3
flowline r1 -> e
flowline r2 -> e
flowline r3 -> e


]]></metadata></svg>