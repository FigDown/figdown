" y1="39.599999999999994" x2="494" y2="39.599999999999994" stroke="transparent" stroke-width="12"/><text x="502" y="43.599999999999994" font-size="11" text-anchor="start" fill="#fff" stroke="#fff" stroke-width="3" stroke-linejoin="round">Max cap</text><text x="502" y="43.599999999999994" font-size="11" text-anchor="start" fill="#ef4444">Max cap</text></g><g data-gline="23" data-gtop="-6" data-gbot="222" style="cursor:ns-resize"><line x1="-14" y1="187.8" x2="494" y2="187.8" stroke="#ef4444" stroke-width="2" stroke-dasharray="7 4"/><line x1="-14" y1="187.8" x2="494" y2="187.8" stroke="transparent" stroke-width="12"/><text x="502" y="191.8" font-size="11" text-anchor="start" fill="#fff" stroke="#fff" stroke-width="3" stroke-linejoin="round">Reserved</text><text x="502" y="191.8" font-size="11" text-anchor="start" fill="#ef4444">Reserved</text></g><text x="240" y="208.9" font-size="11" text-anchor="middle" fill="#fff" stroke="#fff" stroke-width="3" stroke-linejoin="round">Reserved</text><text x="240" y="208.9" font-size="11" text-anchor="middle" fill="#334155">Reserved</text></g><metadata id="figdown-source" data-sha256="685db70b002078a2851d5d67d858fd63ea1990f38a1368e6b79c699a8b61e80e" data-engine-version="0.1.7"><![CDATA[
# FigDown — figures as text. Spec: https://github.com/FigDown/figdown

figdown 0.1 block
title "Partition map — a resource pool with global thresholds"

# The GENERIC partition-and-threshold map: one pool, N groups, global
# threshold lines shared by all (group-level scope; per-node scope exists
# for figures whose semantics are per-column). Instances of this category:
# buffer quotas, memory maps, watermark/level charts.
group pool "Resource pool (units)" gap=0
node g0 "Group 0" in=pool fill=transparent
node g1 "Group 1" in=pool fill=transparent
node g2 "Group 2" in=pool fill=transparent
node g3 "Group 3" in=pool fill=transparent
flow down
rank g0,g1,g2,g3
pin g0 width=120 height=190
pin g1 width=120 height=190
pin g2 width=120 height=190
pin g3 width=120 height=190

threshold "Max cap"  in=pool offset=80%
threshold "Reserved" in=pool offset=15%
band "Reserved" 15% in=pool fill=#a3c93a

]]></metadata></svg>