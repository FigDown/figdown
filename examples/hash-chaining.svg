stroke="#fff" stroke-width="3" stroke-linejoin="round">next</text><text x="316.4" y="126.25" font-size="11" text-anchor="middle" fill="#555">next</text><path d="M340 132 L329.92 137.6 L329.92 126.4 z" fill="#555" stroke="none"/></g><metadata id="figdown-source" data-sha256="adee6ccac0071bd04ee142522f54eb7848b34feb2e0edee3a77f75ac1ed49589" data-engine-version="0.1.1"><![CDATA[
# FigDown — figures as text. Spec: https://github.com/FigDown/figdown

figdown 0.1 block
title "Hash table with chaining"

# Static data-structure figure: a hash table of 4 buckets where
# collisions are resolved by a linked list (separate chaining).
#   bucket[0] — empty
#   bucket[1] — 2-node chain  (two keys hashed to slot 1)
#   bucket[2] — 1-node chain  (one key in slot 2)
#   bucket[3] — empty
# The bucket array is a fixed-size slot group; each chain entry node
# holds a key/value pair and a next-pointer edge to the successor.

group table "Bucket array" gap=0
node b0 "[ 0 ] null" in=table fill=#f1f5f9
node b1 "[ 1 ] •"    in=table fill=#f1f5f9
node b2 "[ 2 ] •"    in=table fill=#f1f5f9
node b3 "[ 3 ] null" in=table fill=#f1f5f9

# chain for bucket 1 — two entries
node e1a "key=alpha\nval=42\nnext •" fill=#dbeafe
node e1b "key=gamma\nval=7\nnext null" fill=#dbeafe

# chain for bucket 2 — one entry
node e2a "key=beta\nval=99\nnext null" fill=#dcfce7

flow right

# bucket pointers into chain heads
edge b1 -[ptr]-> e1a
edge b2 -[ptr]-> e2a

# chain links
edge e1a -[next]-> e1b

layout
# Bucket array: left column. Each slot is 68 px tall to match the
# chain-entry height; 10 px gap between rows keeps them visually distinct.
# Row pitch = 78 px (68 h + 10 gap). Chain heads at x=200, e1b at x=340.
# Group origin at canvas y=60 (fy=10, y0=50); members at group-local coords.
pin table at=(0,10)
pin b0 at=(0,0) width=110 height=68
pin b1 at=(0,78) width=110 height=68
pin b2 at=(0,156) width=110 height=68
pin b3 at=(0,234) width=110 height=68
pin e1a at=(200,78)
pin e1b at=(340,78)
pin e2a at=(200,156)

]]></metadata></svg>