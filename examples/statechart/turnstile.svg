><text x="3.7140894640486977" y="81.61373194823561" font-size="11" text-anchor="start" fill="#fff" stroke="#fff" stroke-width="3" stroke-linejoin="round">push</text><text x="3.7140894640486977" y="81.61373194823561" font-size="11" text-anchor="start" fill="#555">push</text><path d="M33.7340894640487 56.31373194823561 L40.21509433248936 65.85118317459836 L29.060180617445198 66.85512540895235 z" fill="#555" stroke="none"/><text x="97.2" y="41.3" font-size="11" text-anchor="start" fill="#fff" stroke="#fff" stroke-width="3" stroke-linejoin="round">push</text><text x="97.2" y="41.3" font-size="11" text-anchor="start" fill="#555">push</text><path d="M71.2 46 L81.28 40.4 L81.28 51.6 z" fill="#555" stroke="none"/><text x="111.6" y="121.3" font-size="11" text-anchor="start" fill="#fff" stroke="#fff" stroke-width="3" stroke-linejoin="round">coin</text><text x="111.6" y="121.3" font-size="11" text-anchor="start" fill="#555">coin</text><path d="M85.6 126 L95.67999999999999 120.4 L95.67999999999999 131.6 z" fill="#555" stroke="none"/><rect x="0" y="163" width="16" height="11" fill="#e0e7ff" stroke="#555"/><text x="21" y="172.5" font-size="11" fill="#1d1d1b">A mode of the turnstile mechanism</text></g><metadata id="figdown-source" data-sha256="a40f5ec7863eb420825dc8817ddbe1bda236e45e8edbea12349641c76c171f09" data-engine-version="0.1.8"><![CDATA[
# FigDown — figures as text. Spec: https://github.com/FigDown/figdown

# Classic teaching FSM: subway turnstile (Hopcroft/Ullman-style example).
# Interim spelling: figdown 0.1 block (portable). Planned genre: statechart
# (decisions/registry.md) — not registered in the engine yet.
#
# Authoring style: short canvas labels; multi-line human notes as # lines
# (Markdown-like editing — do not pack the whole story into mid labels).
figdown 0.1 block
title "Turnstile statechart (classic FSM)"

class mode "A mode of the turnstile mechanism" fill=#e0e7ff

# ── states ──────────────────────────────────────────────────────────
node locked "LOCKED" class=mode
# Barrier locked. Coin is accepted; pushing the arm does nothing useful.

node unlocked "UNLOCKED" class=mode
# Barrier free for one passage. A second coin is kept (or ignored);
# push returns the machine to LOCKED.

# ── transitions ─────────────────────────────────────────────────────
edge locked -[coin]-> unlocked
# trigger: coin
# effect: unlock barrier (one fare)

edge unlocked -[push]-> locked
# trigger: push (person passes)
# effect: relock barrier

edge locked -[push]-> locked
# trigger: push while locked
# effect: none (stay locked) — self-loop

edge unlocked -[coin]-> unlocked
# trigger: extra coin while unlocked
# effect: none / farebox keeps coin — self-loop

flow right
rank locked,unlocked

]]></metadata></svg>