>yes</text><text x="207.33496897169888" y="476.34497443059604" font-size="11" text-anchor="start" fill="#555">yes</text><path d="M236.0239383938394 510.66221198156677 L225.07377169049153 507.04831530776835 L233.30734750001278 499.4556721982269 z" fill="#555" stroke="none"/><text x="121.86503102830115" y="476.34497443059604" font-size="11" text-anchor="start" fill="#fff" stroke="#fff" stroke-width="3" stroke-linejoin="round">no</text><text x="121.86503102830115" y="476.34497443059604" font-size="11" text-anchor="start" fill="#555">no</text><path d="M81.17606160616063 510.66221198156677 L83.89265249998722 499.4556721982269 L92.1262283095085 507.04831530776835 z" fill="#555" stroke="none"/><text x="290.37307692307695" y="16" font-size="10" text-anchor="middle" fill="#fff" stroke="#fff" stroke-width="3" stroke-linejoin="round">from ingress port</text><text x="290.37307692307695" y="16" font-size="10" text-anchor="middle" fill="#555">from ingress port</text><rect x="0" y="583.6622119815668" width="16" height="11" fill="#16a34a" stroke="#555"/><text x="21" y="593.1622119815668" font-size="11" fill="#1d1d1b">Forward — send the frame out the single learned egress port</text><rect x="0" y="603.6622119815668" width="16" height="11" fill="#2563eb" stroke="#555"/><text x="21" y="613.1622119815668" font-size="11" fill="#1d1d1b">Flood — send out every port in the VLAN except the ingress port</text><rect x="0" y="623.6622119815668" width="16" height="11" fill="#dc2626" stroke="#555"/><text x="21" y="633.1622119815668" font-size="11" fill="#1d1d1b">Filter — discard; destination is out the same port it arrived on</text></g><metadata id="figdown-source" data-sha256="a40dea326cd8c523f5fbe86e4a906de9acf7b3367a5b6f2cc9d4356e624d1b70" data-engine-version="0.1.1"><![CDATA[
# FigDown — figures as text. Spec: https://github.com/FigDown/figdown

figdown 0.1 flowchart
# The classic learning-bridge / L2 switch forwarding decision (IEEE 802.1D).
# A frame arrives; the switch learns the source, looks up the destination,
# and takes one of three actions. The LOGIC is machine-readable: a reader
# answers "when does a switch flood?" by tracing the Y/N edges — no pixels.
title "L2 Switch Forwarding Decision"

# Semantic classes: the three terminal OUTCOMES. Each label states the
# MEANING; the legend derives from these lines (spec §2.7).
class forward "Forward — send the frame out the single learned egress port" fill=#16a34a
class flood   "Flood — send out every port in the VLAN except the ingress port" fill=#2563eb
class filter  "Filter — discard; destination is out the same port it arrived on" fill=#dc2626

# The wire is external to the decision logic: the frame enters from outside
# the figure (spec §2.8 external — never drawn as a shape, edge ends open).
external wire "from ingress port"

# 0.1 (`FLOWCHART-ROLE-KEYWORDS`): the role is a WORD, not a shape. `process` for the two
# steps, `decision` for the two branch points, `terminator` for the three
# outcomes — the diamond and the rounded ends are DERIVED, and a reading agent
# gets the roles from the model instead of inferring them from geometry.
process learn  "Learn source MAC:\nupdate MAC table\n(SA -> ingress port)"
process lookup "Look up destination MAC\nin MAC table"
decision hit   "Entry found?"
decision same  "Egress port ==\ningress port?"
terminator fwd "Forward out\nlearned port"                    class=forward
terminator fld "Flood to all ports\nin VLAN except ingress"   class=flood
terminator flt "Filter (drop):\nsame-port destination"        class=filter

# top-to-bottom reading order for the decision process.
flow down

edge wire   -> learn
edge learn  -> lookup
edge lookup -> hit
# Miss (unknown unicast, or broadcast/multicast) -> flood.
edge hit  -[no]->  fld
edge hit  -[yes]-> same
# Hit, but destination is behind the ingress port -> filter; else forward.
edge same -[yes]-> flt
edge same -[no]->  fwd

]]></metadata></svg>