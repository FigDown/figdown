 x1="0" y1="295" x2="0" y2="373" stroke="#c9c7bf"/><line x1="78.4" y1="295" x2="78.4" y2="373" stroke="#c9c7bf"/><line x1="229.60000000000002" y1="295" x2="229.60000000000002" y2="373" stroke="#c9c7bf"/><line x1="380.80000000000007" y1="295" x2="380.80000000000007" y2="373" stroke="#c9c7bf"/><line x1="0" y1="295" x2="380.80000000000007" y2="295" stroke="#c9c7bf"/><line x1="0" y1="321" x2="380.80000000000007" y2="321" stroke="#c9c7bf"/><line x1="0" y1="347" x2="380.80000000000007" y2="347" stroke="#c9c7bf"/><line x1="0" y1="373" x2="380.80000000000007" y2="373" stroke="#c9c7bf"/><text x="0" y="417" font-size="13" font-weight="600"></text><rect x="0" y="425" width="85.6" height="26" fill="#eeede6" stroke="none" data-cell="rings:0:1" style="cursor:pointer"/><text x="42.8" y="442.3" font-size="12" text-anchor="middle" font-weight="600">Port</text><rect x="85.6" y="425" width="78.4" height="26" fill="#eeede6" stroke="none" data-cell="rings:0:2" style="cursor:pointer"/><text x="124.8" y="442.3" font-size="12" text-anchor="middle" font-weight="600">Ring #0</text><rect x="164" y="425" width="78.4" height="26" fill="#eeede6" stroke="none" data-cell="rings:0:3" style="cursor:pointer"/><text x="203.2" y="442.3" font-size="12" text-anchor="middle" font-weight="600">Ring #1</text><rect x="0" y="451" width="85.6" height="26" fill="#fff" stroke="none" data-cell="rings:1:1" style="cursor:pointer"/><text x="7" y="468.3" font-size="12" text-anchor="start">et-0/0/0</text><rect x="85.6" y="451" width="78.4" height="26" fill="#fff" stroke="none" data-cell="rings:1:2" style="cursor:pointer"/><text x="157" y="468.3" font-size="12" text-anchor="end">4096</text><rect x="164" y="451" width="78.4" height="26" fill="#fff" stroke="none" data-cell="rings:1:3" style="cursor:pointer"/><text x="235.4" y="468.3" font-size="12" text-anchor="end">4096</text><rect x="0" y="477" width="85.6" height="26" fill="#fff" stroke="none" data-cell="rings:2:1" style="cursor:pointer"/><text x="7" y="494.3" font-si