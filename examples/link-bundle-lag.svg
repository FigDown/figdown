xt-anchor="middle" fill="#fff" data-port-sq="279.60,44.12" stroke="#fff" stroke-width="3" stroke-linejoin="round">ge-0/0/1</text><text x="263.76126160188085" y="66.88894683807142" font-size="10" text-anchor="middle" fill="#555" data-port-sq="279.60,44.12">ge-0/0/1</text><text x="111.23636363636363" y="100.87696709585121" font-size="10" text-anchor="middle" fill="#fff" data-port-sq="85.60,78.81" stroke="#fff" stroke-width="3" stroke-linejoin="round">ge-0/0/2</text><text x="111.23636363636363" y="100.87696709585121" font-size="10" text-anchor="middle" fill="#555" data-port-sq="85.60,78.81">ge-0/0/2</text><text x="253.96363636363637" y="88.1230329041488" font-size="10" text-anchor="middle" fill="#fff" data-port-sq="279.60,51.05" stroke="#fff" stroke-width="3" stroke-linejoin="round">ge-0/0/2</text><text x="253.96363636363637" y="88.1230329041488" font-size="10" text-anchor="middle" fill="#555" data-port-sq="279.60,51.05">ge-0/0/2</text><line x1="106.09999999999998" y1="71.87696709585121" x2="85.6" y2="71.87696709585121" stroke="#555" stroke-width="1" opacity="0.6"/><line x1="259.60700626120223" y1="77.6230329041488" x2="279.6" y2="51.05248095332593" stroke="#555" stroke-width="1" opacity="0.6"/><text x="0" y="166.5" font-size="11" fill="#1d1d1b">A physical link that is a member of the aggregation</text></g><metadata id="figdown-source" data-sha256="48c619e7ab23e22b3f9ebc9a8fb7f1d638ba068e819459ad31cb07bb899582b1" data-engine-version="0.5.1"><![CDATA[
# FigDown — figures as text. Spec: https://github.com/FigDown/figdown

figdown 0.5 topology
title "Three-link aggregation between two switches"

# A link bundle's DEFINING case: several parallel links between one pair of
# devices, operated as one logical link. Until `figdown 0.5` this figure could
# not be written — a bundle named its members by endpoint pair, and between
# these two switches the pair "sw1--sw2" names three links at once.
#
# Each member link carries its own `id=`, and the bundle names the ids. The
# ids are HANDLES and nothing else: `m1` does not say the link is first, or
# primary, or related to `m2`. The membership claim is made by the `bundle`
# line, and the interface names are made by the end labels.

class member "A physical link that is a member of the aggregation"

node sw1 "Switch-1"
node sw2 "Switch-2"

edge sw1 [ge-0/0/0] -- [ge-0/0/0] sw2 id=m1 class=member
edge sw1 [ge-0/0/1] -- [ge-0/0/1] sw2 id=m2 class=member
edge sw1 [ge-0/0/2] -- [ge-0/0/2] sw2 id=m3 class=member

bundle ae0 "ae0 — link aggregation group" m1,m2,m3

# The management link is deliberately NOT a member, and it is anonymous: a
# connector nobody needs to name does not need an id, and its absence asserts
# nothing at all.
node mgmt "Management switch"
edge sw1 -- mgmt

]]></metadata></svg>