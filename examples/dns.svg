resource records in the additional records section</title></rect><text x="224" y="202.85" font-size="11" text-anchor="middle">ARCOUNT</text><rect x="0" y="214" width="448" height="30" fill="#fff" stroke="none"><title>Variable-length sections follow the header; see RFC 1035 §4.1.2–4.1.4</title></rect><text x="224" y="232.85" font-size="11" text-anchor="middle">Question / Answer / Authority / Additional sections</text><line x1="0" y1="34" x2="0" y2="244" stroke="#555"/><line x1="28" y1="64" x2="28" y2="94" stroke="#555"/><line x1="140" y1="64" x2="140" y2="94" stroke="#555"/><line x1="168" y1="64" x2="168" y2="94" stroke="#555"/><line x1="196" y1="64" x2="196" y2="94" stroke="#555"/><line x1="224" y1="64" x2="224" y2="94" stroke="#555"/><line x1="252" y1="64" x2="252" y2="94" stroke="#555"/><line x1="336" y1="64" x2="336" y2="94" stroke="#555"/><line x1="448" y1="34" x2="448" y2="244" stroke="#555"/><line x1="0" y1="34" x2="448" y2="34" stroke="#555"/><line x1="0" y1="64" x2="448" y2="64" stroke="#555"/><line x1="0" y1="94" x2="448" y2="94" stroke="#555"/><line x1="0" y1="124" x2="448" y2="124" stroke="#555"/><line x1="0" y1="154" x2="448" y2="154" stroke="#555"/><line x1="0" y1="184" x2="448" y2="184" stroke="#555"/><line x1="0" y1="214" x2="448" y2="214" stroke="#555"/><line x1="0" y1="244" x2="448" y2="244" stroke="#555"/></g><metadata id="figdown-source" data-sha256="5e2c8e3c2ea9cf835898a9ce89361c687606e2c3df5b0b9f33007f39ec98f119" data-engine-version="0.2.0"><![CDATA[
# FigDown — figures as text. Spec: https://github.com/FigDown/figdown

figdown 0.1 bitfield

# DNS Message Header — RFC 1035 §4.1.1
# Each row is 16 bits, MSB-0 numbering (bit 0 at left).

bitfield dns "DNS Message Header (RFC 1035)" word=16 numbering=msb0

# Row 1: Transaction ID
field "ID" 16 description="Identifier assigned by the program that generates the query; copied into the reply"

# Row 2: Flags (QR + Opcode + AA + TC + RD + RA + Z + RCODE = 16 bits)
field QR:1,Opcode:4,AA:1,TC:1,RD:1,RA:1,Z:3,RCODE:4

# Row 3: Question Count
field "QDCOUNT" 16 description="Number of entries in the question section"

# Row 4: Answer Record Count
field "ANCOUNT" 16 description="Number of resource records in the answer section"

# Row 5: Authority Record Count
field "NSCOUNT" 16 description="Number of name server resource records in the authority section"

# Row 6: Additional Record Count
field "ARCOUNT" 16 description="Number of resource records in the additional records section"

# Variable-length sections (one representative row each)
break
field "Question / Answer / Authority / Additional sections" * description="Variable-length sections follow the header; see RFC 1035 §4.1.2–4.1.4"

]]></metadata></svg>