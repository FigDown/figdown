<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 116" width="360" height="116" font-family="system-ui,sans-serif"><title>Two hosts and one router</title><desc data-desc-state="derived">Topology figure &quot;Two hosts and one router&quot;. 3 nodes, 2 connectors, 1 group. Flow direction: right. Nodes: h1 &quot;Host A&quot;, r &quot;Router&quot;, h2 &quot;Host B&quot;. Group core &quot;Core&quot; contains: r. Class edgelink means &quot;the physical link between a host and the router&quot;.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#bbb" stroke-width="2"/></pattern></defs><g transform="translate(18,6)"><g data-group="core" data-gx="127.2" data-gy="20" style="cursor:move"><rect x="113.2" y="-6" width="99.2" height="74" rx="10" fill="#f6f5ef" stroke="#d6d4cc"/><text x="123.2" y="10" font-size="11.5" fill="#6f6e69">Core</text></g><line data-edge="8" x1="71.2" y1="38" x2="127.20000000000002" y2="38" stroke="#555" stroke-width="1.6"/><line data-edge="9" x1="198.4" y1="38" x2="254.4" y2="38" stroke="#555" stroke-width="1.6"/><g data-node="h1" data-x="0" data-y="20" style="cursor:move"><rect x="0" y="20" width="71.2" height="36" fill="#fff" stroke="#8a8880"/><text x="35.6" y="42.55" font-size="13" text-anchor="middle" fill="#1d1d1b">Host A</text></g><g data-node="r" data-x="127.2" data-y="20" style="cursor:move"><rect x="127.2" y="20" width="71.2" height="36" fill="#fff" stroke="#8a8880"/><text x="162.8" y="42.55" font-size="13" text-anchor="middle" fill="#1d1d1b">Router</text></g><g data-node="h2" data-x="254.4" data-y="20" style="cursor:move"><rect x="254.4" y="20" width="71.2" height="36" fill="#fff" stroke="#8a8880"/><text x="290" y="42.55" font-size="13" text-anchor="middle" fill="#1d1d1b">Host B</text></g><path d="M127.20000000000002 38 L117.12000000000002 43.6 L117.12000000000002 32.4 z" fill="#555" stroke="none"/><path d="M254.4 38 L244.32 43.6 L244.32 32.4 z" fill="#555" stroke="none"/><text x="0" y="98.5" font-size="11" fill="#1d1d1b">the physical link between a host and the router</text></g><metadata id="figdown-source" data-sha256="4b223375c7d408ad7336488a11b5e34ea47e8f4603dc0a9c8270f16b7f50deda" data-engine-version="0.5.1" data-render-options="with-a11y"><![CDATA[
figdown 0.5 topology
title "Two hosts and one router"
class edgelink "the physical link between a host and the router"
group core "Core"
node h1 "Host A"
node r "Router" in=core
node h2 "Host B"
edge h1 -> r class=edgelink
edge r -> h2 class=edgelink

]]></metadata></svg>